name: Notify repro-three of changes

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger merge in repro-three
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com/cheating-at-solitaire/repro-one.git \
            -d '{"event_type":"source-updated","client_payload":{"source_repo":"${{ github.repository }}"}}'
